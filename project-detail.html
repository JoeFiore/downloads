<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details - Joe's Downloads</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #2d3d54;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;

      /* Badge Color Variables */
      --badge-music: rgba(236, 72, 153, 0.2);
      --badge-music-text: #f472b6;
      --badge-app: rgba(59, 130, 246, 0.2);
      --badge-app-text: #60a5fa;
      --badge-mc: rgba(34, 197, 94, 0.2);
      --badge-mc-text: #4ade80;
      --badge-video: rgba(168, 85, 247, 0.2);
      --badge-video-text: #c084fc;
      --badge-script: rgba(245, 158, 11, 0.2);
      --badge-script-text: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header.navbar {
      background-color: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 16px 24px;
    }

    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--accent-color);
      border: none;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
      border-color: var(--text-muted);
      transform: translateY(-2px);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    main {
      max-width: 900px;
      width: 100%;
      margin: 40px auto;
      padding: 0 20px;
      flex-grow: 1;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      margin-bottom: 25px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--accent-color);
    }

    .detail-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .badge-music { background: var(--badge-music); color: var(--badge-music-text); }
    .badge-app { background: var(--badge-app); color: var(--badge-app-text); }
    .badge-mc { background: var(--badge-mc); color: var(--badge-mc-text); }
    .badge-video { background: var(--badge-video); color: var(--badge-video-text); }
    .badge-script { background: var(--badge-script); color: var(--badge-script-text); }

    .project-title {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .meta-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 18px;
    }

    .media-box {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .media-box-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    audio, video {
      width: 100%;
      border-radius: 8px;
    }

    .description-content {
      font-size: 1.05rem;
      color: #cbd5e1;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    .features-list {
      margin-top: 20px;
      padding-left: 20px;
    }

    .features-list li {
      margin-bottom: 8px;
    }

    .actions-bar {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 25px;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Joe's Downloads</span>
      </a>
      <div class="nav-links">
        <a href="projects.html" class="btn btn-secondary btn-sm">All Projects</a>
        <a href="https://joes-server-pc.dedyn.io:3923" target="_blank" class="btn btn-sm">Copyparty Server</a>
      </div>
    </div>
  </header>

  <main>
    <!-- Back to Projects link -->
    <a href="projects.html" class="back-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Back to All Projects</span>
    </a>

    <!-- Project Detail Card -->
    <article class="detail-card">
      <span id="projectBadge" class="badge">Category</span>
      <h1 id="projectTitle" class="project-title">Loading Project...</h1>
      <div class="meta-bar">
        <span id="projectDate">Updated Date</span>
        <span>•</span>
        <span id="projectIdText">ID: -</span>
      </div>

      <!-- Optional Media Preview Player -->
      <div id="mediaBox" class="media-box" style="display: none;">
        <div class="media-box-title" id="mediaBoxTitle">Media Preview</div>
        <div id="mediaContainer"></div>
      </div>

      <!-- Description Content -->
      <div id="projectDescription" class="description-content">
        Loading details...
      </div>

      <!-- Action Download Buttons -->
      <div class="actions-bar">
        <a id="downloadBtn" href="#" target="_blank" class="btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span>Download File</span>
        </a>
        <a id="serverBtn" href="https://joes-server-pc.dedyn.io:3923" target="_blank" class="btn btn-secondary">
          <span>Open in Copyparty Server</span>
        </a>
      </div>
    </article>
  </main>

  <footer>
    Powered by Copyparty & GitHub Pages. Built for Joe's Personal Projects.
  </footer>

  <script>
    // Database of showcase projects
    const projectsDatabase = {
      '26.2-newest': {
        title: '26.2 Newest',
        category: 'mc',
        badgeClass: 'badge-mc',
        badgeLabel: 'Minecraft Instance',
        date: 'Updated: Sep 16 2026',
        downloadUrl: 'https://joes-server-pc.dedyn.io:3923/files/26.2NEW/26.2NEW.zip?=dl',
        description: `
          <p>This instance can be used with the newest server I have set up. Below will have a detailed way on installing and making sure it works! \n\n Heres how to set it up:</p>
          <ul class="features-list">
            <li>Download the file to a memorable place for now.</li>
            <li>Go to a 3rd Party Launcher ex: Prism Launcher.</li>
            <li>Find where you Import a Instance if using Prism Launcher go to Add Instance > Import > "Path to 26.2NEW.zip" > OK</li>
            <li>Then Launch the Instance!</li>
          </ul>
        `
      }
    };

    function loadProjectDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get('id') || '26.2-newest';

      // Check if project exists in database or generate dynamic fallback for custom IDs
      let project = projectsDatabase[projectId];

      if (!project) {
        // Fallback info so the page never renders blank
        const cleanTitle = projectId.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        project = {
          title: cleanTitle || 'Project Details',
          category: 'app',
          badgeClass: 'badge-app',
          badgeLabel: 'File Release',
          date: 'Updated: Recently',
          downloadUrl: `https://joes-server-pc.dedyn.io:3923/files/${projectId}`,
          mediaType: 'none',
          description: `<p>Viewing details for release item <strong>${projectId}</strong>. Click the download button below to fetch the file directly from the Copyparty host server.</p>`
        };
      }

      // Populate DOM elements
      document.title = `${project.title} - Joe's Downloads`;
      document.getElementById('projectTitle').innerText = project.title;
      document.getElementById('projectBadge').className = `badge ${project.badgeClass}`;
      document.getElementById('projectBadge').innerText = project.badgeLabel;
      document.getElementById('projectDate').innerText = project.date;
      document.getElementById('projectIdText').innerText = `ID: ${projectId}`;
      document.getElementById('projectDescription').innerHTML = project.description;
      document.getElementById('downloadBtn').href = project.downloadUrl;

      // Handle optional media previews
      const mediaBox = document.getElementById('mediaBox');
      const mediaContainer = document.getElementById('mediaContainer');
      const mediaBoxTitle = document.getElementById('mediaBoxTitle');

      if (project.mediaType === 'audio' && project.mediaUrl) {
        mediaBoxTitle.innerText = 'Audio Preview Track';
        mediaContainer.innerHTML = `<audio controls src="${project.mediaUrl}"></audio>`;
        mediaBox.style.display = 'block';
      } else {
        mediaBox.style.display = 'none';
        mediaContainer.innerHTML = '';
      }
    }

    window.onload = loadProjectDetails;
  </script>
</body>
</html>
