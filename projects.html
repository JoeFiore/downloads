<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects Showcase - Joe's Downloads</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #2d3d54;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;

      /* Badge Color Variables */
      --badge-music: rgba(236, 72, 153, 0.2);
      --badge-music-text: #f472b6;
      --badge-app: rgba(59, 130, 246, 0.2);
      --badge-app-text: #60a5fa;
      --badge-mc: rgba(34, 197, 94, 0.2);
      --badge-mc-text: #4ade80;
      --badge-video: rgba(168, 85, 247, 0.2);
      --badge-video-text: #c084fc;
      --badge-script: rgba(245, 158, 11, 0.2);
      --badge-script-text: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      min-height: 100vh;
    }

    header.navbar {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 16px 24px;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--accent-color);
      border: none;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
      border-color: var(--text-muted);
      transform: translateY(-2px);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 80px 20px;
    }

    .page-header {
      margin-bottom: 35px;
    }

    .page-title {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Controls Bar: Search & Category Filters */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    .search-input {
      width: 100%;
      max-width: 480px;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .filter-tags {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 6px;
      scrollbar-width: thin;
    }

    .tag-btn {
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tag-btn.active, .tag-btn:hover {
      background: var(--accent-color);
      color: #fff;
      border-color: var(--accent-color);
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 28px;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 14px;
    }

    .badge-music { background: var(--badge-music); color: var(--badge-music-text); }
    .badge-app { background: var(--badge-app); color: var(--badge-app-text); }
    .badge-mc { background: var(--badge-mc); color: var(--badge-mc-text); }
    .badge-video { background: var(--badge-video); color: var(--badge-video-text); }
    .badge-script { background: var(--badge-script); color: var(--badge-script-text); }

    .project-card h3 {
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 22px;
      flex-grow: 1;
    }

    .card-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      gap: 10px;
    }

    .card-actions .btn {
      flex: 1;
    }

    .section-divider {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--border-color) 30%, var(--border-color) 70%, transparent 100%);
      margin: 45px 0;
    }

    .empty-state {
      color: var(--text-muted);
      font-style: italic;
      grid-column: 1 / -1;
      padding: 30px 0;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Joe's Downloads</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="btn btn-secondary btn-sm">Home</a>
        <a href="https://joes-server-pc.dedyn.io:3923" target="_blank" class="btn btn-sm">Copyparty Server</a>
      </div>
    </div>
  </header>

  <main>
    <div class="page-header">
      <h1 class="page-title">Projects & Downloads</h1>
      <p class="page-subtitle">Browse all Minecraft packs, web applications, and utility scripts.</p>
    </div>

    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search projects..." oninput="handleSearch()" />

      <div class="filter-tags">
        <button class="tag-btn active" onclick="filterCategory('all', event)">All Projects</button>
        <button class="tag-btn" onclick="filterCategory('mc', event)">Minecraft Packs</button>
        <button class="tag-btn" onclick="filterCategory('script', event)">Scripts & Tools</button>
      </div>
    </div>

    <section>
      <h2 class="section-title">📌 Pinned Projects</h2>
      <div class="projects-grid" id="pinnedGrid"></div>
    </section>

    <hr class="section-divider" />

    <section>
      <h2 class="section-title">✨ All Releases</h2>
      <div class="projects-grid" id="newestGrid"></div>
    </section>
  </main>

  <footer>
    Powered by Copyparty & GitHub Pages. Built for Joe's Music & Personal Projects.
  </footer>

  <script>
    const projectsData = [
      {
        id: '26.2-newest',
        pinned: true,
        title: '26.2 (Newest)',
        category: 'mc',
        badgeClass: 'badge-mc',
        badgeLabel: 'Minecraft Instance',
        shortDesc: 'Install the Latest Instance used today!',
        date: 'Updated: Sept 16 2026',
        downloadUrl: 'https://joes-server-pc.dedyn.io:3923/files/26.2NEW/26.2NEW.zip?=dl'
      }
    ];

    let currentCategory = 'all';
    let searchQuery = '';

    function createCardElement(project) {
      const card = document.createElement('div');
      card.className = 'project-card';
      card.innerHTML = `
        <div>
          <span class="badge ${project.badgeClass}">${project.badgeLabel}</span>
          <h3>${project.title}</h3>
          <p>${project.shortDesc}</p>
        </div>
        <div class="card-footer">
          <div class="card-meta">
            <span>${project.date}</span>
          </div>
          <div class="card-actions">
            <a href="${project.downloadUrl}" target="_blank" class="btn btn-sm">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              <span>Download</span>
            </a>
            <a href="project-detail.html?id=${project.id}" class="btn btn-secondary btn-sm">
              <span>View Details</span>
            </a>
          </div>
        </div>
      `;
      return card;
    }

    function renderProjects() {
      const pinnedGrid = document.getElementById('pinnedGrid');
      const newestGrid = document.getElementById('newestGrid');

      pinnedGrid.innerHTML = '';
      newestGrid.innerHTML = '';

      const filtered = projectsData.filter(project => {
        const matchesCategory = currentCategory === 'all' || project.category === currentCategory;
        const matchesSearch = project.title.toLowerCase().includes(searchQuery) ||
                              project.shortDesc.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      const pinnedItems = filtered.filter(p => p.pinned);
      const newestItems = filtered.filter(p => !p.pinned);

      if (pinnedItems.length > 0) {
        pinnedItems.forEach(p => pinnedGrid.appendChild(createCardElement(p)));
      } else {
        pinnedGrid.innerHTML = '<p class="empty-state">No pinned projects found.</p>';
      }

      if (newestItems.length > 0) {
        newestItems.forEach(p => newestGrid.appendChild(createCardElement(p)));
      } else {
        newestGrid.innerHTML = '<p class="empty-state">No projects found matching criteria.</p>';
      }
    }

    function filterCategory(category, e) {
      currentCategory = category;
      document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
      if (e && e.target) {
        e.target.classList.add('active');
      }
      renderProjects();
    }

    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      renderProjects();
    }

    window.onload = function() {
      renderProjects();
    };
  </script>
</body>
</html>
