<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joe's Downloads & Projects</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 80px 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(30,41,59,0.5) 0%, rgba(15,23,42,1) 100%);
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background-color: var(--accent-color);
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 50px 20px;
      flex: 1;
    }

    .section-title {
      font-size: 1.8rem;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
    }

    /* Projects Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    .project-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .project-card h3 {
      font-size: 1.3rem;
      margin-bottom: 10px;
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    /* Uptime Section */
    .uptime-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin-bottom: 40px;
    }

    .uptime-section p {
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .modal h3 {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .modal p {
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .modal-actions {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
    }

    footer {
      text-align: center;
      padding: 25px 20px;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- Hero Section -->
  <header>
    <h1>Joe's Downloads & Projects</h1>
    <p>Access downloads & projects</p>
    <a href="https://joes-server-pc.dedyn.io:3923" target="_blank" class="btn">Access Files</a>
  </header>

  <main>
    <!-- Server Uptime Section -->
    <div class="uptime-section">
      <h2>Server Infrastructure & Status</h2>
      <p>Real-time monitoring and uptime status for host machine services and direct file links.</p>
      <a href="https://stats.uptimerobot.com/LArexeMxjZ" target="_blank" class="btn btn-secondary">Check Live Server Status</a>
    </div>
  </main>
  
  <!-- Footer -->
  <footer>
    Using copyparty, GitHub Pages and Uptime Robot to make this project successful!
  </footer>

  <script>
    function openModal(title, description, downloadUrl) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalDescription').innerText = description;
      document.getElementById('modalDownloadLink').href = downloadUrl;
      document.getElementById('projectModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('projectModal').classList.remove('active');
    }

    // Close modal when clicking background overlay
    document.getElementById('projectModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeModal();
      }
    });
  </script>
</body>
</html>
